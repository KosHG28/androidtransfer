name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidtransfer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # actions/upload-artifact only attaches the APK to this workflow run
      # (Actions tab, expires after 90 days). Publishing it as a Release
      # asset too is what makes it show up under the repo's Releases page
      # and gives it a stable download link.
      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Debug build (latest)"
          body: |
            Автоматическая debug-сборка последнего коммита ветки `${{ github.ref_name }}` (`${{ github.sha }}`).
            Собирается автоматически при каждом push в этот workflow (Build APK) и заменяет предыдущий APK в этом релизе.
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
